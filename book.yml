---
 - name: manage docker container
   hosts: all 
   tasks:
     - name: install docker
       yum:
         name: docker
         state: present
     - name: start and enable docker
       service:
         name: docker
         state: started
         enabled: yes
     - name: create directory
       file:
         path: /pro1
         state: directory
     - name: transfer docker file
       copy:
         src: Dockerfile
         dest: /pro1/
     - name: change owner and group ownership
       command: chown itadmin:tadmin /pro1
     - name: add itadmin into docker group
       command: gpasswd -a itadmin docker 
     - name: create container from docker file
       shell: cd /pro1; docker build -t boothapp .
     - name: create docker container
       shell: docker run -dt --name=c1 -t -p 80:80  boothapp
